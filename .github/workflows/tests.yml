name: Run tests

on:
  push:
    branches: ["main"]
    paths-ignore: ['**.md', '**.rst']   # skip the suite on pure docs changes
  pull_request:
    branches: ["main"]
    paths-ignore: ['**.md', '**.rst']

# Cancel superseded runs when a branch/PR is pushed again in quick succession.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Experimental legs (3.14) are allowed to fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]     # full 3-OS coverage on the primary version
        include:
          # Supported range 3.11–3.13, ubuntu-only to keep the job count down.
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          # 3.14: experimental (allow-failure) — deps may not have wheels yet.
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Install package (dev extra = runtime + test + docs + tooling)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test with pytest
        # Coverage gate runs once, on the canonical ubuntu + 3.11 leg; the other
        # legs run without coverage to only verify install + tests pass.
        run: >
          pytest
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11')
              && '--cov=template_project --cov-report=term-missing' || '' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .
