name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Critical: "bash -l {0}" is required for Micromamba environments to activate
        shell: bash -l {0}
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: docs/environment.yml
        cache-environment: true

    - name: Install package
      run: |
        micromamba run -n template-project python -m pip install -e ".[dev]" --force-reinstall
        # Force version file regeneration with setuptools-scm
        micromamba run -n template-project python -c "import setuptools_scm; print('Version detected:', setuptools_scm.get_version())"
        # Verify what version the docs will see
        micromamba run -n template-project python -c "from template_project._version import __version__; print('Docs will use version:', __version__)"

    - name: Build documentation
      run: |
        set -e
        micromamba run -n template-project jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output=demo-output2.ipynb --ExecutePreprocessor.allow_errors=False
        mv notebooks/*output2.ipynb docs/source/
        pushd docs
        micromamba run -n template-project make clean html
        popd

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
        # Replace gh-pages with a single commit each deploy: the built site is
        # regenerable, and keeping full history re-committed the whole site every
        # run (107 copies of the built demo notebook bloated gh-pages to ~71 MB).
        force_orphan: true