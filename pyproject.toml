[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=82.0.1",
  "setuptools-scm[toml]>=9.2.2",
  "wheel",
]

[project]
name = "template-project-efw"
description = "Example template project for docs, pip install and git"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime dependencies live here (no requirements.txt); only the version is dynamic.
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "xarray>=2023.12.0",
  "netcdf4>=1.7.2",       # xarray NetCDF read/write engine (used implicitly)
  "scipy>=1.10",
  "matplotlib>=3.7",
  "requests>=2.28",       # HTTP downloads in utilities.download_file
]
dynamic = ["version"]
[project.urls]
documentation = "https://github.com/eleanorfrajka/template-project"
homepage = "https://github.com/eleanorfrajka/template-project"
repository = "https://github.com/eleanorfrajka/template-project"

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-cov>=4.1",
]
docs = [
  "sphinx>=7.4.7",
  "sphinx-rtd-theme>=2.0",
  "myst-nb>=1.3.0",
  "myst-parser>=3.0.1",
  "nbsphinx>=0.9",
  "pypandoc>=1.11",
]
# Everything a contributor needs: runtime + test + docs + tooling.
# One command: `pip install -e ".[dev]"`.
dev = [
  "template-project-efw[test,docs]",
  "ruff>=0.6",
  "jupyterlab>=4.0",
  "nbconvert>=7.8",
  "towncrier",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["template_project", "template_project.*"]

[tool.setuptools.package-data]
"template_project" = ["py.typed", "*.mplstyle", "*.yaml", "*.yml", "*.json"]

[tool.setuptools_scm]
write_to = "src/template_project/_version.py"
write_to_template = "__version__ = '{version}'"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "W",       # pycodestyle warnings
  "F",       # pyflakes errors
  "I",       # isort
  "B",       # flake8-bugbear
  "UP",      # pyupgrade
  "D",       # pydocstyle (Docstrings)
  "C901",    # mccabe complexity
  "PLR",     # pylint refactor (includes function length)
  "ANN",     # flake8-annotations (require type annotations)
  "TRY",     # tryceratops (exception-handling anti-patterns)
  "BLE",     # flake8-blind-except (no bare `except Exception`)
  "SLF",     # flake8-self (no private-member access from outside)
  "ARG",     # flake8-unused-arguments
  "SIM",     # flake8-simplify
  "RUF",     # ruff-specific rules
]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # 1 blank line required before class docstring
  "D213",    # multi-line summary docstring style
  "D401",    # first line should be in imperative mood
  "E501",    # line‑length (handled by ruff format)
  "ANN401",  # allow typing.Any (common in xarray/dataset helper signatures)
  "TRY003",  # allow long messages in raised exceptions
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings, type annotations, private-member guards, or
# unused-argument checks (mock signatures often take args they ignore).
"tests/*" = ["D100", "D103", "ANN", "SLF001", "ARG"]
"docs/source/conf.py" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
# Maximum allowed complexity for functions (start lenient, can tighten later)
max-complexity = 15

[tool.ruff.lint.pylint]
# Maximum number of statements in a function body (your CONTRIBUTING.md suggests ~50 lines)
max-statements = 75
# Maximum number of arguments for function / method
max-args = 8
# Maximum number of branches for function / method body  
max-branches = 20
# Maximum number of return statements in function / method body
max-returns = 8

# Testing configuration with pytest markers
# Usage examples:
#   pytest                         # Run all tests
#   pytest -m "not slow"          # Skip slow tests
#   pytest -m "integration"       # Run only integration tests  
#   pytest -m "unit and not slow" # Run fast unit tests
#   pytest -m "network"           # Run only tests requiring network
#   pytest -m "file_io"           # Run only file I/O tests
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose --strict-markers --tb=short --maxfail=3"
minversion = "6.0"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "network: marks tests requiring network access",
    "file_io: marks tests that interact with file system",
]

[tool.coverage.run]
source = ["template_project"]
omit = [
    "template_project/_version.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true

[tool.towncrier]
# Configuration for automated changelog generation
package = "template_project"
package_dir = "template_project"
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
template = "changelog.d/_template.md"
title_format = "## [{version}] - {date}"
issue_format = "[#{issue}](https://github.com/[OWNER]/[REPO]/issues/{issue})"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = false
